spring:
  application:
    name: fulfillment-core
  lifecycle:
    timeout-per-shutdown-phase: 20s
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/fulfillment}
    username: ${DB_USERNAME:fulfillment_app}
    password: ${DB_PASSWORD:local-development-only}
    hikari:
      connection-timeout: 3000
      maximum-pool-size: 10
      minimum-idle: 1
  flyway:
    enabled: true
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      connect-timeout: 2s
      timeout: 2s

server:
  address: ${SERVER_ADDRESS:127.0.0.1}
  port: ${SERVER_PORT:8080}
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
        add-additional-paths: true
      group:
        readiness:
          include: readinessState,db,redis
  info:
    env:
      enabled: false

logging:
  level:
    root: INFO
